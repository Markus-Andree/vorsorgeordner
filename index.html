<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2d6a4c">
<meta name="description" content="Digitaler Vorsorgeordner: alle wichtigen Angaben für den Ernstfall, verschlüsselt auf dem eigenen Gerät.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vorsorge">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Digitaler Vorsorgeordner</title>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#1c2822;--muted:#56665e;--line:#d6ddd8;--acc:#2d6a4c;--acc-ink:#fff;--acc2:#e5efe9;--warn:#8a5200;--warnbg:#fff3dc;--bad:#a32626;--badbg:#fdeaea;--r:12px}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;line-height:1.5}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
h1{font-size:1.6rem}h2{font-size:1.3rem}h3{font-size:1.08rem}
a{color:var(--acc)}
button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid #b9c4be;background:#fff;padding:.5rem .95rem;color:var(--ink)}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
button.primary:hover{filter:brightness(1.08)}
button.big{font-size:1.08rem;padding:.75rem 1.2rem}
button.link{border:none;background:none;color:var(--acc);padding:0;text-decoration:underline}
button.danger{color:var(--bad);border-color:#e2b4b4}
input,select,textarea{font:inherit;width:100%;padding:.5rem .65rem;border:1px solid #aebab3;border-radius:9px;background:#fff;color:var(--ink)}
textarea{min-height:4.6rem;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #8cc3a6;outline-offset:1px}
label{display:block;font-size:.88rem;color:var(--muted);margin-bottom:.2rem}
.hint{font-size:.82rem;color:var(--muted);margin-top:.2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem}
.note{background:var(--acc2);border-radius:var(--r);padding:.8rem 1rem;margin-bottom:1rem;font-size:.95rem}
.warnbox{background:var(--warnbg);color:#4a2e00;border-radius:var(--r);padding:.8rem 1rem;margin-bottom:1rem;font-size:.95rem}
.errbox{background:var(--badbg);color:var(--bad);border-radius:9px;padding:.6rem .8rem;margin:.6rem 0}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* Start */
.start{max-width:620px;margin:3rem auto;padding:0 16px}
.start .logo{font-size:2.6rem}
.olist button{display:flex;justify-content:space-between;width:100%;text-align:left;margin-bottom:.5rem;padding:.8rem 1rem}
.stack>*+*{margin-top:.8rem}

/* App layout */
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
.side{background:#1f3a2d;color:#e6efe9;padding:1rem .7rem;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .who{padding:.3rem .6rem 1rem;font-size:.9rem;color:#b8cbbf}
.side .who b{display:block;color:#fff;font-size:1.05rem}
.side button{display:flex;gap:.6rem;align-items:center;width:100%;text-align:left;background:none;border:none;color:#e6efe9;padding:.55rem .7rem;border-radius:8px;font-size:.98rem}
.side button:hover{background:rgba(255,255,255,.08)}
.side button.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
.side button.emerg{background:#b8432f;color:#fff;font-weight:600;margin:.3rem 0 .6rem}
.side button.emerg.on{background:#d24e37}
.side .sep{border-top:1px solid rgba(255,255,255,.15);margin:.6rem .4rem}
.side .pct{margin-left:auto;font-size:.75rem;opacity:.75}
.main{padding:1.6rem 2rem 4rem;max-width:980px;width:100%}
.topbar{display:none}
.install{border:2px solid var(--acc)}
.install ol{margin:.4rem 0 0;padding-left:1.3rem}
.install li{margin:.3rem 0}
.status{position:fixed;right:14px;bottom:12px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:.25rem .8rem;font-size:.82rem;color:var(--muted);box-shadow:0 2px 8px rgba(0,0,0,.06)}

/* Forms */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem 1rem}
.field.wide{grid-column:1/-1}
.pw{display:flex;gap:.4rem}.pw input{flex:1}.pw .eye{padding:.3rem .6rem}
details.entry{border:1px solid var(--line);border-radius:10px;margin-bottom:.6rem;background:#fbfcfb}
details.entry>summary{cursor:pointer;padding:.65rem .9rem;font-weight:600;list-style:none;display:flex;gap:.5rem;align-items:center}
details.entry>summary::before{content:"▸";color:var(--acc);transition:transform .15s}
details.entry[open]>summary::before{transform:rotate(90deg)}
details.entry>summary .sub{font-weight:400;color:var(--muted);font-size:.9rem}
details.entry .body{padding:.2rem .9rem 1rem}
.entryfoot{display:flex;justify-content:flex-end;margin-top:.8rem}

/* Overview */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.8rem}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1rem;text-align:left;width:100%}
.tile .ic{font-size:1.5rem}
.tile b{display:block;margin:.2rem 0}
.bar{height:7px;background:#e3e9e5;border-radius:5px;overflow:hidden;margin-top:.5rem}
.bar i{display:block;height:100%;background:var(--acc)}

/* Checklist */
.phase{margin-bottom:1.4rem}
.phase h2{display:flex;gap:.6rem;align-items:baseline}
.phase h2 .when{font-size:.85rem;font-weight:400;color:var(--muted)}
.item{display:flex;gap:.8rem;background:#fff;border:1px solid var(--line);border-radius:10px;padding:.75rem .9rem;margin-bottom:.5rem}
.item input{width:1.35rem;height:1.35rem;flex:none;margin-top:.15rem;accent-color:var(--acc)}
.item.done{opacity:.6}
.item.done .t{text-decoration:line-through}
.item .t{font-weight:600}
.item .d{font-size:.92rem;color:var(--muted)}
.item .data{font-size:.9rem;background:var(--acc2);border-radius:7px;padding:.3rem .6rem;margin-top:.35rem;white-space:pre-line}

/* ---------- Einfache Ansicht ---------- */
.bigstart{font-size:1.25rem}.bigstart input{font-size:1.3rem;padding:.8rem}.bigstart button.big{width:100%;font-size:1.3rem}
.iv{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(#f8f5ec,#eaf2ec);font-size:var(--ivfs,1.3rem)}
.iv-top{display:flex;align-items:center;gap:.8rem;padding:max(.6rem,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) .6rem max(16px,env(safe-area-inset-left));background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.iv-top .plant{font-size:2rem;line-height:1;transition:transform .4s}
.iv-top .plant.grow{animation:grow .6s ease}
@keyframes grow{50%{transform:scale(1.35)}}
.iv-prog{flex:1;min-width:0}
.iv-prog .bar{height:12px;margin:0}
.iv-prog .bar i{transition:width .6s ease}
.iv-prog .lbl{font-size:.7em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iv-top button{font-size:.75em;padding:.5rem .8rem}
.iv-main{flex:1;display:flex;justify-content:center;padding:1.4rem 16px 2.5rem}
.iv-card{width:100%;max-width:760px;animation:ivIn .45s ease both}
@keyframes ivIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.iv-chap{font-size:.72em;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.iv-q{font-size:1.45em;font-weight:700;line-height:1.3;margin:.25em 0 .35em}
.iv-help{color:var(--muted);font-size:.85em;margin-bottom:.9em}
.iv textarea,.iv input{font-size:1.05em;padding:.7rem .9rem;border-width:2px;border-radius:14px}
.iv textarea{min-height:4.2em}
.iv textarea.long{min-height:7em}
.iv button{font-size:1em;border-radius:14px;padding:.75rem 1.1rem;min-height:3.3rem;border-width:2px}
.iv .pw button{min-height:auto}
.iv-mic{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;margin:.9rem 0 .3rem;background:var(--acc);color:#fff;border-color:var(--acc)!important;font-weight:700;position:relative}
.iv-mic .ic{font-size:1.4em}
.iv-mic.on{background:#b8432f;border-color:#b8432f!important}
.iv-mic.on::before,.iv-mic.on::after{content:"";position:absolute;inset:-3px;border-radius:16px;border:3px solid #b8432f;animation:ring 1.5s ease-out infinite;pointer-events:none}
.iv-mic.on::after{animation-delay:.75s}
@keyframes ring{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(1.06,1.6)}}
.iv-small{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.4rem}
.iv-small button{font-size:.8em;min-height:2.6rem;padding:.4rem .8rem;background:#fff}
.iv-choices{display:grid;gap:.6rem}
.iv-choices button{text-align:left;background:#fff;transition:transform .15s,background .2s}
.iv-choices button:active{transform:scale(.98)}
.iv-choices button.sel{background:var(--acc2);border-color:var(--acc);font-weight:700}
.iv-choices button.sel::after{content:"  ✓";color:var(--acc)}
.iv-nav{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.4rem}
.iv-nav .next{flex:1 1 12rem;background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.iv-nav .back,.iv-nav .skip{background:#fff}
.iv-heard{background:var(--acc2);border-radius:12px;padding:.6rem .9rem;margin-top:.5rem;font-size:.85em;animation:ivIn .3s ease both}
.iv-info{background:var(--warnbg);border-radius:12px;padding:.7rem .9rem;margin-top:.6rem;font-size:.8em}
.iv-intro{text-align:center}
.iv-icon{font-size:5.5rem;line-height:1;margin:1.2rem 0 .6rem;display:inline-block;animation:float 3.2s ease-in-out infinite}
.iv-halo{display:inline-block;border-radius:50%;padding:1.2rem 1.6rem;background:radial-gradient(circle,#fff 40%,rgba(255,255,255,0) 70%);animation:halo 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes halo{0%,100%{box-shadow:0 0 0 0 rgba(45,106,76,.0)}50%{box-shadow:0 0 0 18px rgba(45,106,76,.08)}}
.iv-menu{display:grid;gap:.7rem}
.iv-menu button{text-align:left;background:#fff}
.iv-set{display:grid;gap:1rem}
.iv-set .opts{display:flex;gap:.5rem;flex-wrap:wrap}
.iv-set .opts button.sel{background:var(--acc2);border-color:var(--acc);font-weight:700}
body:has(.iv) .status{display:none}
.dots{flex:1;display:flex;gap:.45rem;justify-content:center;align-items:center}
.dots span{width:.7rem;height:.7rem;border-radius:1rem;background:#cfd8d2;transition:all .35s ease}
.dots span.on{background:var(--acc);width:1.9rem}
.dots span.done{background:#8fb8a1}
.why .why-p{font-size:1.02em;line-height:1.55;margin:.7em 0;animation:ivIn .5s ease both}
.why.quote .why-p{background:#fff;border-left:5px solid var(--acc);border-radius:0 12px 12px 0;padding:.6em .9em}
.why-list{list-style:none;padding:0;margin:.4em 0 .6em}
.why-list li{background:#fff;border:2px solid var(--line);border-radius:14px;padding:.55em .8em;margin:.45em 0;animation:ivIn .5s ease both}
.why-list li::before{content:"❔ "}
.bigstart label{font-size:1rem}
.bigstart .hint{font-size:.95rem}
.bigstart h1{font-size:1.9rem}
details.more summary{cursor:pointer;color:var(--acc);font-weight:600}
@media (prefers-reduced-motion:reduce){.why .why-p,.why-list li{animation:none!important}}
.petal{position:fixed;top:-50px;font-size:1.9rem;animation:fall linear forwards;pointer-events:none;z-index:50}
@keyframes fall{to{transform:translateY(112vh) rotate(380deg)}}
@media (prefers-reduced-motion:reduce){.iv-card,.iv-icon,.iv-halo,.iv-mic.on::before,.iv-mic.on::after,.petal,.iv-heard,.plant{animation:none!important}}

.ptabs{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:0 0 1rem}
.ptabs button{border-radius:22px;padding:.45rem 1rem}
.ptabs button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.ptabs.big button{font-size:1.05rem;padding:.65rem 1.2rem}
.badge{display:inline-block;margin-left:.6rem;font-size:.75rem;font-weight:600;background:var(--acc2);color:var(--acc);border-radius:12px;padding:.1rem .55rem;vertical-align:middle}
.iv-person{display:inline-block;background:var(--acc);border:2px solid var(--acc);color:#fff;border-radius:20px;padding:.2em .9em;font-size:.95em;font-weight:700;margin-bottom:.3em}

#print{display:none}

@media (max-width:820px){
 html{font-size:16px}
 .app{display:block}
 .side{position:fixed;inset:0 25% 0 0;z-index:20;transform:translateX(-105%);transition:transform .2s;height:100%}
 .app.menu .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
 .topbar{display:flex;align-items:center;gap:.6rem;position:sticky;top:0;z-index:10;background:#1f3a2d;color:#fff;padding:.6rem 16px}
 .topbar button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff}
 .main{padding:1rem 16px 4rem}
 .grid{grid-template-columns:1fr}
}
@media print{
 body{background:#fff}
 #root,.status{display:none!important}
 #print{display:block;font-size:11pt;color:#000}
 #print h1{font-size:18pt}#print h2{font-size:14pt;border-bottom:1px solid #999;padding-bottom:2pt;margin-top:14pt}#print h3{font-size:11.5pt;margin:8pt 0 3pt}
 #print table{width:100%;border-collapse:collapse;margin-bottom:6pt}
 #print td{border-bottom:1px solid #ddd;padding:2pt 4pt;vertical-align:top}
 #print td:first-child{width:38%;color:#444}
 #print .box{border:1.5px solid #000;padding:8pt;margin:8pt 0}
 #print .line{border-bottom:1px solid #000;height:22pt}
 #print section{break-inside:avoid}
}
</style>

<body>
<div id="root"></div>
<div id="print"></div>
<div class="status" id="status" hidden></div>

<script>
'use strict';
/* ============================================================
   Digitaler Vorsorgeordner – Testversion
   Alle Daten bleiben auf diesem Gerät (Browser-Speicher),
   verschlüsselt mit AES-256-GCM, Schlüssel aus dem Passwort
   (PBKDF2-SHA-256, 600.000 Durchläufe).
   ============================================================ */

const APP_VERSION = '0.3 (Testversion)';
const IS_WEB = location.protocol==='http:'||location.protocol==='https:';
const APP_URL = IS_WEB ? location.origin+location.pathname.replace(/index\.html$/,'') : null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isTouch=matchMedia('(pointer: coarse)').matches;
let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;if(!S.key)renderStart();});
window.addEventListener('appinstalled',()=>{installPrompt=null;if(!S.key)renderStart('Die App ist jetzt installiert. Sie finden sie auf dem Startbildschirm als grünes Ordner-Symbol.');});
const AUTO_LOCK_MIN = 10;

/* ---------- Hilfsfunktionen ---------- */
function slug(s){return s.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,40);}
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)for(const[k,v]of Object.entries(attrs)){
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}
  return e;
}
function add(el,...kids){for(const c of kids.flat(Infinity)){if(c==null||c===false||c==='')continue;el.append(c.nodeType?c:String(c));}return el;}
const fmtDate=iso=>{if(!iso)return '';const d=new Date(iso);return isNaN(d)?iso:d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});};
const fmtDT=iso=>{if(!iso)return '';const d=new Date(iso);return d.toLocaleDateString('de-DE')+', '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr';};

/* ---------- Gliederung (angelehnt an den vlbs-Vorsorgeordner, ergänzt) ----------
   Feld-Schreibweise: "Bezeichnung|Typ|Auswahl;Auswahl|Vorgabe|Hinweis"
   Typen: t=Text, a=langer Text, d=Datum, s=Auswahl, p=geheim (Passwort/PIN)          */
function F(str){const[label,type,opts,def,hint]=str.split('|');return{k:slug(label),label,type:type||'t',opts:opts?opts.split(';'):null,def:def||'',hint:hint||''};}
function G(id,title,fields,o={}){return{id,title,fields:fields.map(F),...o};}
const AUFB='Aufbewahrungsort der Unterlagen';
function docGroup(id,title,hint){return G(id,title,['Vorhanden|s|ja;nein;geplant','Erstellt am|d','Bevollmächtigte Person(en)|a','Notariell beurkundet (Datum, Notar)','Im Zentralen Vorsorgeregister registriert|s|ja;nein','Aufbewahrungsort des Originals'],{note:hint});}

const SCHEMA=[
 {id:'person',icon:'👤',title:'Persönliche Angaben',intro:'Grunddaten zu Ihnen und Ihrer Familie. Die Angehörigen brauchen sie für Standesamt, Bestatter und Behörden.',groups:[
  G('eigene','Eigene Person',['Name, Vorname','Geburtsname','Geburtsdatum|d','Geburtsort','Staatsangehörigkeit','Konfession','Beruf / Amtsbezeichnung','Adresse|a','Telefon','E-Mail','Familienstand|s|ledig;verheiratet;verwitwet;geschieden;eingetragene Lebenspartnerschaft','Familienstand seit|d','Güterstand|s|Zugewinngemeinschaft (gesetzlich);Gütergemeinschaft;Gütertrennung','Steuer-Identifikationsnummer','Krankenkasse','Krankenversicherungsnummer','Aufbewahrungsort Personalausweis / Reisepass','Aufbewahrungsort Geburtsurkunde','Aufbewahrungsort Familienstammbuch / Heiratsurkunde','Aufbewahrungsort Ehevertrag / Scheidungsunterlagen']),
  G('partner','Ehepartner/in bzw. Lebenspartner/in',['Name, Vorname','Geburtsname','Geburtsdatum|d','Geburtsort','Adresse|a','Telefon','E-Mail','Beruf / Status','Ggf. Sterbedatum|d','Ggf. Ort der Beisetzung']),
  G('kinder','Kinder',['Art|s|leibliches Kind;Kind des Ehepartners;Adoptivkind;Pflegekind','Name, Vorname','Geburtsdatum|d','Adresse|a','Telefon','E-Mail','Name des Vaters','Name der Mutter','Ggf. Sterbedatum|d'],{repeat:'Kind'}),
  G('eltern','Eltern',['Rolle|s|Mutter;Vater','Name, Vorname','Geburtsname','Geburtsdatum|d','Adresse|a','Telefon','Ggf. Sterbedatum|d','Ggf. Ort der Beisetzung'],{repeat:'Elternteil'}),
  G('geschwister','Geschwister',['Art|s|leibliche/r Schwester/Bruder;Halbschwester/-bruder','Name, Vorname','Geburtsdatum|d','Adresse|a','Telefon','E-Mail','Ggf. Sterbedatum|d'],{repeat:'Geschwister'}),
  G('verwandte','Sonstige Verwandte und Bekannte',['Verhältnis','Name, Vorname','Adresse|a','Telefon','E-Mail'],{repeat:'Person'}),
  G('vereine','Vereine und Mitgliedschaften',['Name','Anschrift / Kontakt|a','Mitgliedsnummer','Beitrag und Abbuchung','Abbuchung von Konto','Im Todesfall|a|||z. B. kündigen, Sterbegeld der Kasse beantragen',AUFB],{repeat:'Mitgliedschaft'})
 ]},
 {id:'vorsorge',icon:'📜',title:'Vorsorgedokumente',intro:'Hier halten Sie fest, welche Vollmachten und Verfügungen es gibt, wer bevollmächtigt ist und wo das Original liegt.',warn:'Vollmachten und Verfügungen gelten nur auf Papier mit Ihrer eigenhändigen Unterschrift. Diese App ersetzt sie nicht, sie zeigt nur, wo sie liegen. Vorsorgevollmachten können Sie beim Zentralen Vorsorgeregister der Bundesnotarkammer registrieren lassen (www.vorsorgeregister.de).',groups:[
  docGroup('vorsorgevollmacht','Vorsorgevollmacht'),
  docGroup('betreuung','Betreuungsverfügung'),
  docGroup('patient','Patientenverfügung','Tipp: Hausarzt/Hausärztin eine Kopie geben.'),
  docGroup('general','Generalvollmacht'),
  docGroup('bank','Bankvollmacht(en)','Wichtig: Eine Vollmacht „über den Tod hinaus“ erlaubt den Angehörigen den Zugriff aufs Konto, bevor ein Erbschein vorliegt.'),
  docGroup('beihilfevm','Beihilfevollmacht'),
  docGroup('lbvvm','LBV-Vollmacht (Versorgungsbezüge)'),
  docGroup('schweige','Entbindung von der ärztlichen Schweigepflicht'),
  docGroup('beihilfeschweige','Beihilfe: Schweigepflichtentbindung'),
  docGroup('post','Vollmacht für Briefe und Pakete'),
  G('organ','Organspende',['Erklärung vorhanden|s|ja, Organspendeausweis;ja, im Organspende-Register;nein;nein, ich widerspreche','Aufbewahrungsort']),

const SEC=Object.fromEntries(SCHEMA.map(s=>[s.id,s]));

/* ---------- Personen: persönliche und gemeinsame Angaben ----------
   Person „a“ und alle gemeinsamen Gruppen liegen in data.s,
   persönliche Gruppen von Person „b“ in data.pb.                      */
const PER=new Set(['person.eigene','person.partner','person.eltern','person.geschwister','person.vereine','vorsorge.*','gesundheit.*','beruf.*','digital.*','todesfall.nachlass','todesfall.bestattung','todesfall.worte']);
function isPer(sec,grp){return PER.has(sec+'.'+grp)||PER.has(sec+'.*');}
function secHasPer(sec){return SEC[sec].groups.some(g=>isPer(sec,g.id));}
function grpDef(sec,grp){return SEC[sec].groups.find(g=>g.id===grp);}
function persons(){return(S.data&&S.data.persons)||[{id:'a',name:S.name||''}];}
function isCouple(){return persons().length>1;}
function pn(pid){const p=persons().find(x=>x.id===pid)||persons()[0];return(p.name||'').trim().split(/[ ,]+/)[0]||(pid==='b'?'Person 2':'Person 1');}
function getG(sec,grp,pid){
  pid=pid||S.pid||'a';
  const base=(isPer(sec,grp)&&pid!=='a')?(S.data.pb=S.data.pb||{}):S.data.s;
  base[sec]=base[sec]||{};
  if(base[sec][grp]==null)base[sec][grp]=grpDef(sec,grp).repeat?[]:{};
  return base[sec][grp];
}
function optsOf(f){
  if(!f.opts)return null;
  if(f.opts[0]==='@owner')return isCouple()?[pn('a')+' allein',pn('b')+' allein','beide gemeinsam','Sonstige']:['ich allein','gemeinsam mit Ehepartner/in','Sonstige'];
  if(f.opts[0]==='@who')return isCouple()?[pn('a'),pn('b'),'beide']:null;
  return f.opts;
}

/* ---------- Speicher & Verschlüsselung ---------- */
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function deriveKey(pw,salt){
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptObj(key,obj){const iv=rnd(12);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));return{iv:b64(iv),ct:b64(ct)};}
async function decryptObj(key,iv,ct){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(iv)},key,unb64(ct));return JSON.parse(dec.decode(pt));}

const store={
  ok:(()=>{try{localStorage.setItem('vo.t','1');localStorage.removeItem('vo.t');return true}catch(e){return false}})(),
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){localStorage.setItem(k,v)},
  del(k){try{localStorage.removeItem(k)}catch(e){}},
  index(){try{return JSON.parse(this.get('vo.index')||'[]')}catch(e){return[]}},
  saveIndex(ix){this.set('vo.index',JSON.stringify(ix))},
  blob(id){try{return JSON.parse(this.get('vo.data.'+id))}catch(e){return null}},
  upsertIndex(entry){const ix=this.index();const i=ix.findIndex(x=>x.id===entry.id);if(i<0)ix.push(entry);else ix[i]={...ix[i],...entry};this.saveIndex(ix);}
};

const S={id:null,name:'',key:null,salt:null,data:null,view:'home',lastAct:Date.now()};

function newData(opt={}){
  const names=opt.names||[];
  const mk=personalOnly=>{
    const s={};
    for(const sec of SCHEMA){s[sec.id]={};for(const g of sec.groups){
      if(personalOnly&&!isPer(sec.id,g.id))continue;
      if(g.repeat)s[sec.id][g.id]=[];
      else{const o={};if(opt.nrw)for(const f of g.fields)if(f.def)o[f.k]=f.def;s[sec.id][g.id]=o;}
    }}
    if(opt.nrw)s.beruf.verband=[{name:'vlbs'}];
    return s;
  };
  const s=mk(false);
  const d={v:1,s,check:{},iv:{pos:null,ans:{}},persons:[{id:'a',name:names[0]||''}],meta:{mode:opt.mode||'einfach',created:new Date().toISOString(),updated:new Date().toISOString()}};
  if(names[0])s.person.eigene.name_vorname=names[0];
  if(names[1]){d.persons.push({id:'b',name:names[1]});d.pb=mk(true);d.pb.person.eigene.name_vorname=names[1];}
  return d;
}
function lockMinutes(){return S.data&&S.data.meta.mode==='einfach'?30:AUTO_LOCK_MIN;}
function openStart(){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}if(S.data.meta.mode==='einfach')renderInterview();else renderApp();}
async function persist(){
  if(!S.key)return;
  S.data.meta.updated=new Date().toISOString();
  const {iv,ct}=await encryptObj(S.key,S.data);
  const blob={app:'vorsorgeordner',v:1,id:S.id,name:S.name,salt:b64(S.salt),iv,ct,updated:S.data.meta.updated};
  try{store.set('vo.data.'+S.id,JSON.stringify(blob));store.upsertIndex({id:S.id,name:S.name,updated:blob.updated,mode:S.data.meta.mode});setStatus('Gespeichert ✓');}
  catch(e){setStatus('⚠ Speichern fehlgeschlagen!');alert('Speichern fehlgeschlagen: '+e.message);}
}
function touch(){S.lastAct=Date.now();setStatus('Wird gespeichert …');clearTimeout(saveTimer);saveTimer=setTimeout(persist,700);}
function setStatus(t){const el=document.getElementById('status');el.hidden=!S.key;el.textContent=t;}
async function flush(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;await persist();}}
async function lock(){shush();stopListen();await flush();S.key=null;S.data=null;S.id=null;S.view='home';setStatus('');renderStart();}
setInterval(()=>{if(S.key&&Date.now()-S.lastAct>lockMinutes()*60000)lock();},20000);
['click','keydown','touchstart'].forEach(e=>document.addEventListener(e,()=>{S.lastAct=Date.now()},{passive:true}));
window.addEventListener('beforeunload',()=>{if(saveTimer){persist();}});

      h('div',{class:'iv-small',style:'justify-content:center'},h('button',{onclick:()=>{auto=true;say(spoken(s),true);}},'🔊 Vorlesen')),

function renderUnlock(o){
  root.innerHTML='';

  const err=h('div');

    err.innerHTML='';btn.disabled=true;btn.textContent='Wird geöffnet …';
    const blob=store.blob(o.id);
    try{
      const salt=unb64(blob.salt);const key=await deriveKey(pw.value,salt);
      const data=await decryptObj(key,blob.iv,blob.ct);
      Object.assign(S,{id:o.id,name:blob.name,key,salt,data,view:'home',lastAct:Date.now()});
      migrate();openStart();setStatus('Geöffnet');

    h('button',{class:'link',onclick:()=>{shush();renderStart();}},'← zurück'),

function progress(sec){
  let total=0,filled=0,entries=0;
  for(const g of sec.groups){
    const pids=isPer(sec.id,g.id)?persons().map(p=>p.id):['a'];
    for(const pid of pids){
      const val=getG(sec.id,g.id,pid);
      if(g.repeat){entries+=val.length;total+=1;if(val.length)filled+=1;}
      else for(const f of g.fields){if(f.type==='s'&&!optsOf(f))continue;total++;if(val[f.k])filled++;}
    }
  }
  return{pct:total?Math.round(filled/total*100):0,entries};
}

async function exportFile(){
  await flush();
  const blob=store.get('vo.data.'+S.id);
  const fname='Vorsorgeordner_'+S.name.replace(/[^\wäöüÄÖÜß-]+/g,'_')+'_'+new Date().toISOString().slice(0,10)+'.json';
  /* Auf Handy/Tablet: direkt teilen (E-Mail, WhatsApp, Drive …) */
  let shared=false;
  if(isTouch&&navigator.canShare){
    try{
      const file=new File([blob],fname,{type:'application/json'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:'Sicherung Vorsorgeordner',text:'Verschlüsselte Sicherung meines Vorsorgeordners. Nur mit dem Passwort vom Notfallblatt lesbar. Bitte gut aufbewahren.'});
        shared=true;
      }
    }catch(e){if(e.name==='AbortError')return;}
  }
  if(!shared){
    const a=h('a',{href:URL.createObjectURL(new Blob([blob],{type:'application/json'})),download:fname});
    document.body.append(a);a.click();a.remove();
  }
  store.upsertIndex({id:S.id,lastBackup:new Date().toISOString()});
  alert(shared
    ?'Die Sicherung wurde verschickt.\n\nTipp: Schicken Sie sie an eine Vertrauensperson, zum Beispiel per E-Mail oder WhatsApp. Die Datei ist verschlüsselt und nur mit Ihrem Passwort lesbar.'
    :'Die Sicherungsdatei „'+fname+'“ wurde in Ihren Download-Ordner gespeichert.\n\nKopieren Sie sie auf einen USB-Stick oder schicken Sie sie per E-Mail an eine Vertrauensperson. Die Datei ist verschlüsselt und nur mit Ihrem Passwort lesbar.');
  if(document.querySelector('.iv'))ivMenu();else renderApp();
}
function importFile(){
  const inp=h('input',{type:'file',accept:'.json,application/json'});
  inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;
    try{
      const b=JSON.parse(await f.text());
      if(b.app!=='vorsorgeordner'||!b.ct||!b.salt)throw new Error('Das ist keine Sicherungsdatei des Vorsorgeordners.');
      const ex=store.index().find(x=>x.id===b.id);
      if(ex&&!confirm('Der Ordner „'+b.name+'“ ist auf diesem Gerät schon vorhanden (geändert '+fmtDT(ex.updated)+').\nDie Sicherung ist vom '+fmtDT(b.updated)+'.\n\nVorhandenen Ordner durch die Sicherung ERSETZEN?'))return;
      store.set('vo.data.'+b.id,JSON.stringify(b));store.upsertIndex({id:b.id,name:b.name,updated:b.updated,lastBackup:b.updated});
      renderStart('Die Sicherung „'+b.name+'“ wurde geladen. Zum Öffnen anklicken und Passwort eingeben.');
    }catch(e){alert('Laden fehlgeschlagen: '+e.message);}
  };
  inp.click();
}

const PREF_KEY='vo.prefs';
function prefs(){let p={};try{p=JSON.parse(localStorage.getItem(PREF_KEY)||'{}')}catch(e){}return{speak:true,rate:.9,size:1.3,micInfo:false,...p};}
function setPref(k,val){const p=prefs();p[k]=val;try{localStorage.setItem(PREF_KEY,JSON.stringify(p))}catch(e){}}

/* ---------- Vorlesen ---------- */
const canSpeak='speechSynthesis' in window;
let deVoice=null;
function pickVoice(){if(!canSpeak)return;const vs=speechSynthesis.getVoices().filter(x=>/^de/i.test(x.lang));deVoice=vs.find(x=>/natural|online|neural/i.test(x.name))||vs.find(x=>/google/i.test(x.name))||vs.find(x=>x.localService)||vs[0]||null;}
if(canSpeak){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice);}catch(e){speechSynthesis.onvoiceschanged=pickVoice;}}
function say(text,force){
  if(!canSpeak||!text||(!force&&!prefs().speak))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';if(deVoice)u.voice=deVoice;u.rate=prefs().rate;
  speechSynthesis.speak(u);
}
function shush(){if(canSpeak)speechSynthesis.cancel();}

/* ---------- Spracherkennung ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function listen(onText,onEnd){
  if(!SR)return false;
  shush();
  try{rec=new SR();}catch(e){return false;}
  rec.lang='de-DE';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
  let fin='',err=null;
  rec.onresult=e=>{let tmp='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t;else tmp+=t;}onText((fin+' '+tmp).trim());};
  rec.onerror=e=>{err=e.error;};
  rec.onend=()=>{rec=null;onEnd(fin.trim(),err);};
  try{rec.start();}catch(e){rec=null;return false;}
  return true;
}
function stopListen(){if(rec){try{rec.stop();}catch(e){}}}
function micError(err){
  if(err==='not-allowed'||err==='service-not-allowed')return 'Das Mikrofon ist nicht freigegeben. Bitte im Browser erlauben (Schloss-Symbol links neben der Adresse) und noch einmal versuchen.';
  if(err==='network')return 'Für die Spracherkennung ist eine Internetverbindung nötig. Sie können die Antwort auch tippen.';
  if(err==='audio-capture')return 'Es wurde kein Mikrofon gefunden. Sie können die Antwort auch tippen.';
  return 'Die Spracherkennung hat nicht geklappt. Bitte noch einmal versuchen oder tippen.';
}

/* ---------- Hilfen für gesprochene Antworten ---------- */
const MONATE=['jan','feb','mär','apr','mai','jun','jul','aug','sep','okt','nov','dez'];
function parseDate(s){
  const t=String(s).toLowerCase().replace(/\s+/g,' ').trim();let d,m,y,r;
  if((r=t.match(/^(\d{1,2})\.\s?(\d{1,2})\.\s?(\d{4})$/))){d=r[1];m=r[2];y=r[3];}
  else if((r=t.match(/(\d{1,2})\.?\s+([a-zäöü]+)\s+(\d{4})/))){d=r[1];m=MONATE.findIndex(x=>r[2].startsWith(x))+1;if(r[2].startsWith('maer'))m=3;y=r[3];}
  else return null;
  d=+d;m=+m;y=+y;
  if(!(d>=1&&d<=31&&m>=1&&m<=12&&y>1880&&y<2100))return null;
  return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
const isISO=x=>/^\d{4}-\d{2}-\d{2}$/.test(x||'');
function norm(t){return String(t).toLowerCase().replace(/[.,!?;:()\/]/g,' ').replace(/\s+/g,' ').trim();}
function matchChoice(text,choices){
  const t=' '+norm(text)+' ';
  if(/ wei(ß|ss) /.test(t)){const c=choices.find(c=>/^wei/i.test(c[1]));if(c)return c;}
  const yes=/ (ja|jawohl|genau|richtig|stimmt|klar|gerne|doch) /.test(t),no=/ (nein|nee|nö|keine|keinen|kein|keins|nicht) /.test(t);
  for(const c of choices){const l=norm(c[1]);if(l==='ja'&&yes&&!no)return c;if(l==='nein'&&no)return c;}
  let best=null,score=0;
  for(const c of choices){
    const words=norm(c[1]).split(/[ \-]+/).filter(w=>w.length>=4);
    const sc=words.filter(w=>t.includes(w.slice(0,Math.max(4,w.length-2)))).length;
    if(sc>score){score=sc;best=c;}
  }
  if(!best&&no){best=choices.find(c=>/^(kein|nein)/i.test(c[1]))||null;}
  return best;
}

/* ---------- Ablauf ---------- */
function fdef(sec,grp,label){const g=SEC[sec].groups.find(x=>x.id===grp);const f=g&&g.fields.find(x=>x.label===label);if(!f)console.error('Feld fehlt:',sec,grp,label);return f;}
function ivVal(sec,grp,label,pid){const f=fdef(sec,grp,label);return getG(sec,grp,pid||'a')[f.k]||'';}
function stepGrp(s){return s.t?[s.t[0],s.t[1]]:s.where?[s.where[0],s.where[1]]:s.rep?[s.rep[0],s.rep[1]]:null;}
function stepPer(s){if(s.per!==undefined)return s.per;const g=stepGrp(s);return !!g&&isPer(g[0],g[1]);}
function keyPre(s,pid){return isCouple()&&stepPer(s)?pid+'/':'';}
function repList(s,pid){return getG(s.rep[0],s.rep[1],pid);}
function whereEntry(s,create,pid){const list=getG(s.where[0],s.where[1],pid);let e=list.find(x=>Object.entries(s.where[2]).every(([k,v])=>x[k]===v));if(!e&&create){e={...s.where[2]};list.push(e);}return e;}
function pageTarget(p){
  const s=p.s,pid=p.pid;
  if(p.entry!=null){const f=fdef(s.rep[0],s.rep[1],p.f[0]);return{f,get:()=>repList(s,pid)[p.entry][f.k]||'',set:v=>{repList(s,pid)[p.entry][f.k]=v;}};}
  if(s.where){const f=fdef(s.where[0],s.where[1],s.field);return{f,get:()=>{const e=whereEntry(s,false,pid);return e?e[f.k]||'':'';},set:v=>{whereEntry(s,true,pid)[f.k]=v;}};}
  const f=fdef(...s.t);const o=()=>getG(s.t[0],s.t[1],pid);
  return{f,get:()=>o()[f.k]||'',set:v=>{o()[f.k]=v;}};
}
function ivPages(){
  const out=[],couple=isCouple(),ps=persons().map(p=>p.id);
  const emit=(s,ch,icon,pid)=>{
    const kp=keyPre(s,pid);
    if(s.cond&&!s.cond(pid))return;
    if(s.info){out.push({key:kp+s.id,type:'info',ch,icon,s,pid});return;}
    if(s.rep){
      const list=repList(s,pid);
      if(!list.length)out.push({key:kp+s.id+':ask',type:'ask',ch,icon,s,pid});
      list.forEach((e,i)=>s.fields.forEach((f,j)=>{if(f[3]==='couple'&&!couple)return;out.push({key:kp+s.id+':'+i+':'+j,type:'field',ch,icon,s,entry:i,f,pid});}));
      if(list.length)out.push({key:kp+s.id+':more',type:'more',ch,icon,s,pid});
      return;
    }
    out.push({key:kp+s.id,type:'field',ch,icon,s,pid});
  };
  /* Kapitel bilden: bei Paaren erst die gemeinsamen Fragen, dann die persönlichen je Person */
  const chaps=[];let c=null;
  for(const s of IV){if(s.intro||s.end){c={head:s,steps:[]};chaps.push(c);}else c.steps.push(s);}
  for(const c of chaps){
    const s=c.head;
    if(s.end){out.push({key:'end',type:'end',ch:'Geschafft',icon:'🌸',s});continue;}
    out.push({key:'i:'+s.ch,type:'intro',ch:s.ch,icon:s.icon,s});
    if(!couple){c.steps.forEach(st=>emit(st,s.ch,s.icon,'a'));continue;}
    c.steps.filter(st=>!stepPer(st)).forEach(st=>emit(st,s.ch,s.icon,'a'));
    const per=c.steps.filter(stepPer);
    if(per.length)for(const pid of ps){
      const n=out.length;
      out.push({key:pid+'/p:'+s.ch,type:'person',ch:s.ch,icon:s.icon,s,pid});
      per.forEach(st=>emit(st,s.ch,s.icon,pid));
      if(out.length===n+1)out.pop();
    }
  }
  return out;
}

function renderInterview(key){
  shush();stopListen();
  if(S.data.meta.mode!=='einfach'){S.data.meta.mode='einfach';touch();}
  S.data.iv=S.data.iv||{pos:null,ans:{}};
  const pages=ivPages();
  if(key===undefined)key=S.data.iv.pos;
  ivShow(pages,Math.max(0,pages.findIndex(p=>p.key===key)));
}
function ivFrame(label,pct,plant){
  const card=h('div',{class:'iv-card'});
  const pl=h('span',{class:'plant'+(plant!==lastPlant&&lastPlant?' grow':''),'aria-hidden':'true'},plant);lastPlant=plant;
  root.innerHTML='';
  root.append(h('div',{class:'iv',style:'--ivfs:'+prefs().size+'rem'},
    h('div',{class:'iv-top'},pl,
      h('div',{class:'iv-prog'},h('div',{class:'lbl'},label),h('div',{class:'bar'},h('i',{style:'width:'+pct+'%'}))),
      h('button',{onclick:ivMenu},'☰ Menü')),
    h('div',{class:'iv-main'},card)));
  window.scrollTo(0,0);
  return card;
}
function ivShow(pages,i){
  shush();stopListen();
  i=Math.max(0,Math.min(i,pages.length-1));
  const p=pages[i];
  if(S.data.iv.pos!==p.key){S.data.iv.pos=p.key;touch();}
  const pct=Math.round(i/Math.max(1,pages.length-1)*100);
  const plant=pct>=100?'🌸':pct>=75?'🌳':pct>=50?'🪴':pct>=25?'🌿':'🌱';
  const forP=isCouple()&&p.pid&&p.s&&stepPer(p.s);
  const card=ivFrame(p.ch+(forP?' · '+pn(p.pid):'')+(p.type==='intro'||p.type==='end'||p.type==='person'?'':' · Schritt '+(i+1)+' von '+pages.length),pct,plant);
  const rel=d=>{const np=ivPages();const j=np.findIndex(x=>x.key===p.key);ivShow(np,(j<0?i:j)+d);};
  const goKey=k=>{const np=ivPages();const j=np.findIndex(x=>x.key===k);ivShow(np,j<0?i+1:j);};
  const next=()=>rel(1),back=()=>rel(-1);
  const navRow=(opts={})=>h('div',{class:'iv-nav'},
    i>0&&h('button',{class:'back',onclick:back},'◀ Zurück'),
    opts.skip&&h('button',{class:'skip',onclick:next},'Überspringen'),
    opts.next!==false&&h('button',{class:'next',onclick:opts.onNext||next},opts.nextLabel||'Weiter ▶'));
  const sayBtn=text=>h('button',{onclick:()=>say(text,true)},'🔊 Nochmal vorlesen');

  if(p.type==='intro'){
    const text=(p.s.q?p.s.q+' ':'')+p.s.text;
    card.append(h('div',{class:'iv-intro'},
      h('div',{class:'iv-halo'},h('div',{class:'iv-icon','aria-hidden':'true'},p.icon)),
      h('div',{class:'iv-q'},p.s.q||p.ch),h('p',null,p.s.text),
      i===0&&!SR&&h('div',{class:'iv-info'},'Hinweis: Dieser Browser kann keine Sprache erkennen. Tippen Sie Ihre Antworten oder nutzen Sie das Mikrofon auf der Tastatur Ihres Handys.'),
      h('div',{class:'iv-small',style:'justify-content:center'},sayBtn(text)),
      navRow({nextLabel:i===0?'Los geht’s ▶':'Weiter ▶'})));
    say(text);return;
  }
  if(p.type==='person'||p.type==='info'){
    const nm=pn(p.pid);
    const title=p.type==='person'?'Jetzt ist '+nm+' dran':p.s.q;
    const text=p.type==='person'?'Die nächsten Fragen zum Thema „'+p.ch+'“ beantwortet '+nm+'. Bitte das Handy oder Tablet an '+nm+' weitergeben, oder gemeinsam weitermachen.':p.s.text;
    add(card,h('div',{class:'iv-intro'},
      forP&&p.type==='info'&&h('div',{class:'iv-person'},'👤 '+nm),
      h('div',{class:'iv-halo'},h('div',{class:'iv-icon','aria-hidden':'true'},p.type==='person'?'👤':(p.s.icon||'💡'))),
      h('div',{class:'iv-q'},title),h('p',{style:'text-align:left'},text),
      h('div',{class:'iv-small',style:'justify-content:center'},sayBtn(title+'. '+text)),
      navRow({})));
    say(title+'. '+text);return;
  }
  if(p.type==='end'){
    const nm=isCouple()?persons().map(x=>pn(x.id)).join(' und '):ivVal('person','eigene','Name, Vorname').split(/[ ,]/)[0];
    const text='Geschafft! Vielen Dank'+(nm?', '+nm:'')+'. Alle Antworten sind gespeichert. Bitten Sie jetzt eine Vertrauensperson, das Notfallblatt auszudrucken und eine Sicherung zu speichern. Sie können Ihre Antworten jederzeit ändern.';
    card.append(h('div',{class:'iv-intro'},
      h('div',{class:'iv-halo'},h('div',{class:'iv-icon','aria-hidden':'true'},'🌸')),
      h('div',{class:'iv-q'},'Geschafft! Vielen Dank'+(nm?', '+nm:'')+'.'),
      h('p',null,'Alle Antworten sind gespeichert. Sie können sie jederzeit ändern.'),
      h('p',null,'Bitten Sie jetzt eine Vertrauensperson, das Notfallblatt auszudrucken und eine Sicherung zu speichern.'),
      h('div',{class:'iv-menu'},
        h('button',{onclick:printSheet},'🖨 Notfallblatt drucken'),
        h('button',{onclick:exportFile},'💾 Sicherung speichern'),
        h('button',{onclick:()=>{S.view='ernstfall';renderApp();}},'⚠️ Im Ernstfall: Was ist zu tun?'),
        h('button',{onclick:()=>renderInterview('i:Willkommen')},'⏮ Antworten von vorne durchgehen')),
      navRow({next:false})));
    petals();say(text);return;
  }

  /* Frage-Seiten */
  const s=p.s,kp=keyPre(s,p.pid);let q,help,choices=null,tg=null,entryLabel='';
  if(p.type==='ask'){q=s.ask;help=s.help||'';choices=[['ja','Ja'],['nein','Nein']];}
  else if(p.type==='more'){q=s.more;const names=repList(s,p.pid).map(e=>e[slug('Name, Vorname')]||e[slug('Name')]||e[slug('Bank')]||e[slug('Träger')]||e[slug('Gesellschaft')]||e[slug('Anbieter')]||e[slug('Art')]).filter(Boolean);help=names.length?'Bisher eingetragen: '+names.join(', '):'';choices=[['ja','Ja'],['nein','Nein, weiter']];}
  else{
    tg=pageTarget(p);
    if(p.entry!=null){
      const e=repList(s,p.pid)[p.entry];const nm=e[slug('Name, Vorname')]||e[slug('Name')]||'';
      q=p.f[1].replace('{nameD}',nm||s.whoD||'dieser Person').replace('{name}',nm||s.who||'diese Person');help=p.f[2]||'';entryLabel=s.item+' '+(p.entry+1);
    }else{q=s.q;help=s.help||'';}
    if(tg.f.type==='s'||s.choices)choices=s.choices||[...(optsOf(tg.f)||[]).map(o=>[o,cap(o)]),...(s.extra||[])];
  }
  const spoken=(forP?pn(p.pid)+', ':'')+q+(help&&p.type!=='more'?' '+help:'');
  add(card,forP&&h('div',{class:'iv-person'},'👤 '+pn(p.pid)),entryLabel&&h('div',{class:'iv-chap'},entryLabel),h('div',{class:'iv-q'},q),help&&h('div',{class:'iv-help'},help));
  const info=h('div',{class:'iv-info',hidden:true});
  const showInfo=t=>{info.textContent=t;info.hidden=false;say(t);};
  const heard=h('div',{class:'iv-heard',hidden:true});

  /* Mikrofon-Knopf (für Text und Auswahl) */
  const mic=h('button',{class:'iv-mic'},h('span',{class:'ic','aria-hidden':'true'},'🎤'),h('span',null,'Antwort sprechen'));
  const micLabel=t=>{mic.lastChild.textContent=t;};
  const withMicInfo=start=>{
    if(prefs().micInfo)return start();
    const box=h('div',{class:'iv-info'},
      h('p',{style:'margin:0 0 .5rem'},'Zum Erkennen der Sprache schickt der Browser Ihre Stimme an seinen Sprachdienst (zum Beispiel Google, Microsoft oder Apple). Geheime Angaben wie PINs bitte tippen.'),
      h('button',{onclick:()=>{setPref('micInfo',true);box.remove();start();}},'Verstanden, weiter'));
    mic.after(box);say('Bevor es losgeht, ein kurzer Hinweis. '+box.firstChild.textContent);
  };

  if(choices){
    let cur=p.type==='ask'?(S.data.iv.ans[kp+s.id]||''):p.type==='more'?'':tg.get();
    const btns=choices.map(([val,label])=>{
      const b=h('button',{class:(p.type==='field'&&cur===val&&(val||cur))||(p.type==='ask'&&cur&&cur===val)?'sel':''},label);
      b.onclick=()=>{
        btns.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
        if(p.type==='ask'){
          S.data.iv.ans[kp+s.id]=val;
          if(val==='ja'){repList(s,p.pid).push({...(s.preset||{})});touch();goKey(kp+s.id+':0:0');}
          else{touch();setTimeout(next,350);}
          return;
        }
        if(p.type==='more'){
          if(val==='ja'){const l=repList(s,p.pid);l.push({...(s.preset||{})});touch();goKey(kp+s.id+':'+(l.length-1)+':0');}
          else next();
          return;
        }
        tg.set(val);touch();say(val?'Gewählt: '+label:'In Ordnung.');setTimeout(next,1100);
      };
      return b;
    });
    mic.onclick=()=>{
      if(rec){stopListen();return;}
      withMicInfo(()=>{
        const ok=listen(t=>{heard.textContent='„'+t+'“';heard.hidden=false;},(fin,err)=>{
          mic.classList.remove('on');micLabel('Antwort sprechen');
          if(err&&err!=='no-speech'&&err!=='aborted')return showInfo(micError(err));
          if(!fin)return say('Ich habe nichts gehört. Tippen Sie noch einmal auf Antwort sprechen, oder tippen Sie auf eine Antwort.');
          const c=matchChoice(fin,choices);
          if(c){btns[choices.indexOf(c)].click();}
          else say('Das habe ich leider nicht verstanden. Bitte tippen Sie auf eine der Antworten.');
        });
        if(!ok)return showInfo('Dieser Browser kann leider keine Sprache erkennen. Bitte tippen Sie auf eine Antwort.');
        mic.classList.add('on');micLabel('Ich höre zu … (zum Beenden tippen)');
      });
    };
    add(card,h('div',{class:'iv-choices'},btns),SR&&mic,heard,info,
      h('div',{class:'iv-small'},sayBtn(spoken)),
      navRow({skip:p.type==='field',next:false}));
    say(spoken);return;
  }

  /* Freitext */
  const f=tg.f;let inp;
  let start=tg.get();if(f.type==='d'&&isISO(start))start=fmtDate(start);
  if(f.type==='p'){inp=h('input',{type:'password',autocomplete:'off'});}
  else if(f.type==='d'){inp=h('input',{type:'text',inputmode:'text',placeholder:'z. B. 3. März 1938'});}
  else inp=h('textarea',{class:f.type==='a'?'long':'',rows:f.type==='a'?4:2});
  inp.value=start;
  inp.setAttribute('aria-label',q);
  const commit=()=>{let val=inp.value.trim();if(f.type==='d'){const d=parseDate(val);if(d)val=d;}tg.set(val);touch();};
  inp.addEventListener('input',()=>{tg.set(inp.value);touch();});
  let ctl=inp;
  if(f.type==='p'){const eye=h('button',{type:'button',class:'eye'},'👁 Zeigen');eye.onclick=()=>{inp.type=inp.type==='password'?'text':'password';eye.textContent=inp.type==='password'?'👁 Zeigen':'🙈 Verbergen';};ctl=h('div',{class:'pw'},inp,eye);}
  mic.onclick=()=>{
    if(rec){stopListen();return;}
    withMicInfo(()=>{
      const before=inp.value.trim();
      const ok=listen(t=>{inp.value=(before?before+' ':'')+t;},(fin,err)=>{
        mic.classList.remove('on');micLabel('Antwort sprechen');
        if(err&&err!=='no-speech'&&err!=='aborted'){inp.value=before;return showInfo(micError(err));}
        if(!fin){inp.value=before;return say('Ich habe nichts gehört. Tippen Sie noch einmal auf Antwort sprechen.');}
        inp.value=(before?before+' ':'')+fin;commit();
        heard.textContent='Notiert: '+inp.value;heard.hidden=false;
        say('Ich habe notiert: '+fin+'. Wenn das stimmt, tippen Sie auf Weiter.');
      });
      if(!ok)return showInfo('Dieser Browser kann leider keine Sprache erkennen. Tippen Sie in das Feld und nutzen Sie das Mikrofon-Symbol auf der Tastatur.');
      mic.classList.add('on');micLabel('Ich höre zu … (zum Beenden tippen)');
    });
  };
  add(card,ctl,f.type!=='p'&&SR&&mic,heard,info,
    h('div',{class:'iv-small'},sayBtn(spoken),f.type!=='p'&&h('button',{onclick:()=>{inp.value='';commit();heard.hidden=true;inp.focus();}},'✖ Antwort löschen')),
    navRow({skip:true,onNext:()=>{commit();next();}}));
  say(spoken);
}
function petals(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const em=['🌸','🌼','💮','🍃','🌷'];
  for(let k=0;k<18;k++){
    const el=h('span',{class:'petal','aria-hidden':'true',style:'left:'+Math.round(Math.random()*95)+'vw;animation-duration:'+(4+Math.random()*4).toFixed(1)+'s;animation-delay:'+(Math.random()*2).toFixed(1)+'s'},em[k%em.length]);
    document.body.append(el);setTimeout(()=>el.remove(),11000);
  }
}

/* ---------- Druck ---------- */
function doPrint(node){const p=document.getElementById('print');p.innerHTML='';p.append(node);setTimeout(()=>window.print(),50);}
function printAll(withPw){
  const wrap=h('div',null,h('h1',null,'Vorsorgeordner von '+S.name),h('p',null,'Ausdruck vom '+fmtDT(new Date().toISOString())));
  for(const sec of SCHEMA){
    const secEl=h('div',null,h('h2',null,sec.title));let any=false;
    for(const g of sec.groups){
      const pids=isPer(sec.id,g.id)?persons().map(p=>p.id):['a'];
      for(const pid of pids){
        const val=getG(sec.id,g.id,pid);
        const suf=isCouple()&&isPer(sec.id,g.id)?' ('+pn(pid)+')':'';
        const rowsFor=o=>g.fields.filter(f=>o[f.k]).map(f=>h('tr',null,h('td',null,f.label),h('td',{style:'white-space:pre-line'},f.type==='p'&&!withPw?'•••• (in der App)':f.type==='d'?fmtDate(o[f.k]):o[f.k])));
        if(g.repeat){val.forEach((e,i)=>{const r=rowsFor(e);if(r.length){any=true;secEl.append(h('section',null,h('h3',null,g.title+suf+' – '+g.repeat+' '+(i+1)),h('table',null,r)));}});}
        else{const r=rowsFor(val);if(r.length){any=true;secEl.append(h('section',null,h('h3',null,g.title+suf),h('table',null,r)));}}
      }
    }
    if(any)wrap.append(secEl);
  }
  doPrint(wrap);
}
function printSheet(){

  const perPerson=fn=>persons().map(p=>{const old=S.pid;S.pid=p.id;let r;try{r=fn(p.id);}finally{S.pid=old;}return r;});
  const kranke=perPerson(pid=>{
    const m=getG('gesundheit','medizin',pid);
    const rows=[docTxt('vorsorgevollmacht','Vorsorgevollmacht'),docTxt('patient','Patientenverfügung'),
      v(m,'Allergien und Unverträglichkeiten')&&'Allergien: '+v(m,'Allergien und Unverträglichkeiten'),
      v(m,'Wo liegen Medikamentenplan, Impfpass und Arztberichte?')&&'Medikamentenplan: '+v(m,'Wo liegen Medikamentenplan, Impfpass und Arztberichte?'),
      hausarztTxt()].filter(Boolean);
    return rows.length?h('div',null,wir&&h('h3',null,pn(pid)),h('ul',null,rows.map(r=>h('li',null,r)))):null;
  });
  const tod=perPerson(pid=>{
    const b=getG('todesfall','bestattung',pid),d=getG('beruf','dienst',pid);
    const rows=[v(b,'Bestattungsart')&&'Bestattungswunsch: '+v(b,'Bestattungsart')+(v(b,'Friedhof / Ort')?', '+v(b,'Friedhof / Ort'):''),
      v(b,'Bestattungsinstitut')&&'Bestatter: '+v(b,'Bestattungsinstitut'),
      v(d,'Versorgungsstelle')&&'Versorgungsstelle: '+v(d,'Versorgungsstelle')+(v(d,'Personalnummer beim LBV')?', Personalnr. '+v(d,'Personalnummer beim LBV'):'')].filter(Boolean);
    return rows.length?h('div',null,wir&&h('h3',null,pn(pid)),h('ul',null,rows.map(r=>h('li',null,r)))):null;
  });
  doPrint(add(h('div',null),
    h('h1',null,'NOTFALLBLATT – Vorsorgeordner von '+S.name),
    h('p',null,'Stand: '+fmtDate(new Date().toISOString())+'. Wenn '+(wir?'uns':'mir')+' etwas zustößt, finden Sie alle wichtigen Angaben in '+(wir?'unserem':'meinem')+' digitalen Vorsorgeordner.'),
    h('h2',null,'1. So öffnen Sie den Ordner'),
    h('ol',null,
      h('li',null,'Gerät: ',v(ort,'Auf welchem Gerät ist die App eingerichtet?')||'_______________________'),
      h('li',null,'Dort die App „Vorsorgeordner“ öffnen: auf dem Handy oder Tablet das grüne Ordner-Symbol auf dem Startbildschirm antippen'+(APP_URL?', sonst im Internet-Browser die Adresse '+APP_URL+' aufrufen.':', am Computer die Datei „index.html“ im Ordner „Vorsorgeordner\app“ per Doppelklick öffnen.')),
      h('li',null,'Auf „'+S.name+'“ tippen und das Passwort eingeben.'),
      h('li',null,'Auf ',h('b',null,'„Im Ernstfall“'),' tippen. Dort steht Schritt für Schritt, was bei Krankheit oder Unfall und was im Todesfall zu tun ist.')),
    h('p',null,'Falls das Gerät nicht funktioniert oder gesperrt ist: '+(APP_URL?'Auf einem anderen Handy oder Computer die Adresse '+APP_URL+' öffnen':'Die App auf einem anderen Computer öffnen')+', „Sicherungsdatei laden“ wählen und die Sicherungsdatei auswählen. Sie wurde zum Beispiel per E-Mail oder WhatsApp verschickt oder liegt auf einem USB-Stick.'),
    h('p',null,h('b',null,'Sicherungsdatei liegt: '),v(ort,'Wo liegt die Sicherungsdatei?')||'_______________________'),
    h('div',{class:'box'},h('b',null,'Passwort: '),v(ort,'Wo liegt das Passwort?')?'liegt '+v(ort,'Wo liegt das Passwort?'):'',h('div',{class:'line'}),h('div',{style:'font-size:9pt'},'(von Hand eintragen oder auf separatem Zettel im verschlossenen Umschlag)')),
    h('h2',null,'2. Zugriff haben'),
    zug.length?h('ul',null,zug.map(p=>h('li',null,(p.name||'_______________')+' ('+(p.beziehung||'')+')'+(p.telefon?', Tel. '+p.telefon:'')))):h('p',null,'_______________________'),
    h('h2',null,'3. Bei Krankheit oder Unfall'),
    h('p',null,'Bei Lebensgefahr 112, sonst Hausarzt oder 116 117. Vorsorgevollmacht und Patientenverfügung ins Krankenhaus mitnehmen.'),
    kranke,
    h('h2',null,'4. Im Todesfall'),
    h('p',null,'Arzt für den Totenschein rufen, Bestatter beauftragen, Lebens- und Sterbegeldversicherungen schnell melden (Angaben in der App unter „Versicherungen“).'),
    tod,
    h('p',{style:'margin-top:20pt'},'Ort, Datum, Unterschrift: ____________________________________________')
  ));
}
